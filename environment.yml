# conda environment for the main project (training, evaluation, pruning, uncertainty)
#
#   conda env create -f environment.yml
#   conda activate morph-unet
#
# Versions are the ones verified on 2026-10-22 with Python 3.12 (imports, the batchgenerators
# augmentations, medpy metrics, the evaluator). Python and pip come from conda-forge; everything
# else comes from pip at those exact versions, so the environment matches what was tested.
#
# torch 2.14.1 is the CUDA 12.6 build: it runs on Turing and newer GPUs (RTX 2080 Ti, RTX 3060, ...)
# and needs an NVIDIA driver >= 525 (CVSP Kalymnos: 550.163). The default PyPI torch is built for
# CUDA 13 and needs driver >= 580. There is no CUDA 12.6 build for macOS; this file targets the
# Linux GPU machines.
#
# tradseg/ (traditional segmentation) and figs/build_deck.py (python-pptx) need extra packages
# that are not included here; see tradseg/requirements.txt.
name: morph-unet
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu126
      - torch==2.14.1+cu126
      - numpy==2.5.4
      - scipy==1.18.1
      - scikit-image==0.26.0
      - matplotlib==3.11.2
      - pandas==3.1.0
      - medpy==0.5.2
      - nibabel==5.4.2
      - SimpleITK==2.5.6
      - batchgenerators==0.21
